<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UC13 Quiz Pro</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

.app {
  max-width: 400px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 15px;
  color: #38bdf8;
}

button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  background: rgba(56,189,248,0.2);
  color: white;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  cursor: pointer;
}

button:hover {
  background: #38bdf8;
  color: black;
  transform: scale(1.03);
}

.hidden {
  display: none;
}

#answers button {
  background: rgba(255,255,255,0.05);
}

.correct {
  background: #22c55e !important;
}

.wrong {
  background: #ef4444 !important;
}

.top-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: #94a3b8;
}

#explanation {
  margin-top: 10px;
  font-size: 14px;
  color: #94a3b8;
}
</style>
</head>

<body>
<div class="app">
<header>
<h1>UC13 Quiz</h1>
</header>

<main>
<div id="level-select">
<h2>Escolha o nível</h2>
<button onclick="startQuiz('facil')">Fácil</button>
<button onclick="startQuiz('medio')">Médio</button>
<button onclick="startQuiz('dificil')">Difícil</button>
</div>

<div id="quiz" class="hidden">
<div class="top-info">
<span id="progress"></span>
<span id="score"></span>
</div>

<h2 id="question"></h2>
<div id="answers"></div>
<p id="explanation"></p>

<button id="nextBtn">Próxima</button>
</div>
</main>
</div>

<script>
const allQuestions = {

facil: [
{ question: "O que é um app?", answers: ["Um jogo", "Um aplicativo", "Um celular", "Um site"], correct: 1, explanation: "App é um aplicativo para celular." },
{ question: "Qual sistema é mais usado?", answers: ["iOS", "Android", "Windows", "Linux"], correct: 1, explanation: "Android é o mais usado." },
{ question: "O que é celular?", answers: ["Carro", "Telefone portátil", "TV", "Jogo"], correct: 1, explanation: "Celular é portátil." },
{ question: "O que é internet?", answers: ["Rede", "Jogo", "App", "Tela"], correct: 0, explanation: "Internet conecta dispositivos." },
{ question: "O que é botão?", answers: ["Clicar", "Dormir", "Comer", "Andar"], correct: 0, explanation: "Botão é para interação." },
{ question: "O que é tela inicial?", answers: ["Primeira tela", "Erro", "Última", "Código"], correct: 0, explanation: "É a primeira tela." },
{ question: "App de mensagem serve para?", answers: ["Conversar", "Jogar", "Dormir", "Apagar"], correct: 0, explanation: "Serve para conversar." },
{ question: "Quem cria apps?", answers: ["Usuário", "Dev", "Aluno", "Cliente"], correct: 1, explanation: "Dev cria apps." },
{ question: "O que é clicar?", answers: ["Pressionar", "Dormir", "Comer", "Andar"], correct: 0, explanation: "Clicar é interagir." },
{ question: "Tecnologia é?", answers: ["Ferramentas", "Comida", "Roupa", "Casa"], correct: 0, explanation: "Ajuda no dia a dia." }
],

medio: [
{ question: "O que é Kotlin?", answers: ["Sistema", "Linguagem", "App", "Banco"], correct: 1, explanation: "Linguagem Android." },
{ question: "React Native é?", answers: ["Jogo", "Framework", "Sistema", "Celular"], correct: 1, explanation: "Framework mobile." },
{ question: "Programação é?", answers: ["Criar código", "Dormir", "Jogar", "Assistir"], correct: 0, explanation: "Criar instruções." },
{ question: "Java é?", answers: ["Comida", "Linguagem", "App", "Jogo"], correct: 1, explanation: "Linguagem." },
{ question: "Android Studio é?", answers: ["Editor", "Jogo", "Celular", "App"], correct: 0, explanation: "Ferramenta dev." },
{ question: "Interface é?", answers: ["Tela", "Erro", "Banco", "Código"], correct: 0, explanation: "Visual do app." },
{ question: "Usuário é?", answers: ["Quem usa", "Quem cria", "Quem vende", "Quem compra"], correct: 0, explanation: "Quem usa." },
{ question: "Sistema operacional?", answers: ["Controla", "Jogo", "App", "Tela"], correct: 0, explanation: "Controla o sistema." },
{ question: "Código é?", answers: ["Instruções", "Erro", "Tela", "Botão"], correct: 0, explanation: "São comandos." },
{ question: "Banco de dados?", answers: ["Armazena", "Apaga", "Tela", "Botão"], correct: 0, explanation: "Guarda dados." }
],

dificil: [
{ question: "Híbrido é?", answers: ["Só Android", "Só iOS", "Vários sistemas", "Sem código"], correct: 2, explanation: "Funciona em vários." },
{ question: "API é?", answers: ["Banco", "Sistema", "Conexão", "Tela"], correct: 2, explanation: "Conecta sistemas." },
{ question: "Framework é?", answers: ["Base pronta", "Erro", "Tela", "App"], correct: 0, explanation: "Ajuda programar." },
{ question: "UX é?", answers: ["Experiência", "Erro", "Banco", "Sistema"], correct: 0, explanation: "Experiência do usuário." },
{ question: "UI é?", answers: ["Visual", "Erro", "Código", "Banco"], correct: 0, explanation: "Interface visual." },
{ question: "Firebase?", answers: ["Banco online", "Jogo", "Celular", "Tela"], correct: 0, explanation: "Banco na nuvem." },
{ question: "Deploy?", answers: ["Publicar", "Apagar", "Erro", "Código"], correct: 0, explanation: "Publicar app." },
{ question: "Debug?", answers: ["Corrigir", "Criar erro", "Apagar", "Tela"], correct: 0, explanation: "Corrige erros." },
{ question: "Responsivo?", answers: ["Adapta", "Erro", "Código", "Banco"], correct: 0, explanation: "Adapta à tela." },
{ question: "Desempenho?", answers: ["Velocidade", "Erro", "Tela", "Banco"], correct: 0, explanation: "Rapidez do app." }
]
};

let questions = [];
let current = 0;
let score = 0;

const levelSelect = document.getElementById("level-select");
const quiz = document.getElementById("quiz");

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const scoreEl = document.getElementById("score");

function startQuiz(level) {
questions = allQuestions[level];
current = 0;
score = 0;

levelSelect.classList.add("hidden");
quiz.classList.remove("hidden");

loadQuestion();
}

function loadQuestion() {
explanationEl.textContent = "";
nextBtn.style.display = "none";
answersEl.innerHTML = "";

const q = questions[current];

questionEl.textContent = q.question;
progressEl.textContent = `Pergunta ${current + 1}/${questions.length}`;
scoreEl.textContent = `Pontos: ${score}`;

q.answers.forEach((answer, index) => {
const btn = document.createElement("button");
btn.textContent = answer;

btn.onclick = () => {
if (index === q.correct) {
btn.classList.add("correct");
score++;
explanationEl.textContent = "✅ Acertou! " + q.explanation;
nextBtn.style.display = "block";
} else {
btn.classList.add("wrong");
explanationEl.textContent = "❌ Errou! Voltando ao início...";

document.querySelectorAll("#answers button").forEach(b => {
b.disabled = true;
});

setTimeout(() => {
current = 0;
score = 0;
loadQuestion();
}, 1500);

return;
}

document.querySelectorAll("#answers button").forEach(b => {
b.disabled = true;
});
};

answersEl.appendChild(btn);
});
}

nextBtn.onclick = () => {
current++;

if (current < questions.length) {
loadQuestion();
} else {

answersEl.innerHTML = "";
nextBtn.style.display = "none";

if (questions === allQuestions.facil) {
questionEl.textContent = "✅ Nível Fácil concluído!";
explanationEl.textContent = `Pontuação: ${score}/10`;

const btn = document.createElement("button");
btn.textContent = "➡ Ir para nível Médio";
btn.onclick = () => startQuiz("medio");

answersEl.appendChild(btn);
}

else if (questions === allQuestions.medio) {
questionEl.textContent = "🔥 Nível Médio concluído!";
explanationEl.textContent = `Pontuação: ${score}/10`;

const btn = document.createElement("button");
btn.textContent = "➡ Ir para nível Difícil";
btn.onclick = () => startQuiz("dificil");

answersEl.appendChild(btn);
}

else {
questionEl.textContent = "🏆 PARABÉNS!";
explanationEl.textContent = "Você zerou TODOS os níveis!";

const btn = document.createElement("button");
btn.textContent = "🔄 Jogar novamente";
btn.onclick = () => location.reload();

answersEl.appendChild(btn);
}
}
};
</script>
</body>
</html>
