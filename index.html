<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Loja Gangster Profissional</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  margin:20px;
}
header h1{
  color:#f0a500;
  text-align:center;
}
#produtos .produto{
  border:1px solid #fff;
  padding:15px;
  margin:10px 0;
  display:flex;
  justify-content: space-between;
  align-items:center;
}
button{
  background:#f0a500;
  border:none;
  padding:8px 15px;
  cursor:pointer;
  color:#000;
  font-weight:bold;
}
button:hover{
  background:#ffa500;
}
#dashboard{
  margin-top:30px;
  border-top:2px solid #f0a500;
  padding-top:10px;
}
pre{
  background:#222;
  padding:10px;
  max-height:300px;
  overflow:auto;
}
</style>
</head>
<body>

<header>
  <h1>Loja Gangster</h1>
</header>

<section id="produtos">
  <!-- Produtos adicionados pelo JS -->
</section>

<section id="dashboard">
  <h2>Dashboard</h2>
  <p>Total vendas: <span id="total-vendas">0</span></p>
  <p>Últimas vendas:</p>
  <pre id="historico"></pre>
</section>

<script>
// Lista de produtos
const produtos = [
  {nome:"Produto A", preco:100},
  {nome:"Produto B", preco:200},
  {nome:"Produto C", preco:300},
  {nome:"Produto D", preco:400}
]

// Histórico em memória
let vendas = []

// Inicializa produtos na tela
const produtosDiv = document.getElementById("produtos")
produtos.forEach(p => {
  const div = document.createElement("div")
  div.classList.add("produto")
  div.innerHTML = `
    <span>${p.nome} - R$ ${p.preco}</span>
    <button onclick="comprar('${p.nome}',${p.preco})">Comprar</button>
  `
  produtosDiv.appendChild(div)
})

// Atualiza dashboard
function atualizarDashboard(){
  document.getElementById("total-vendas").innerText = vendas.length
  document.getElementById("historico").textContent = JSON.stringify(vendas,null,2)
}

// Função de compra
function comprar(nome, preco){
  const venda = {
    produto: nome,
    preco: preco,
    data: new Date().toLocaleString()
  }
  vendas.push(venda)
  atualizarDashboard()
  alert(`Compra realizada: ${nome}`)
}

// Inicializa dashboard
atualizarDashboard()
</script>

</body>
</html>
