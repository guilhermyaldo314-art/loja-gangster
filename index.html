<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Loja Gangster Profissional</title>
<style>
/* ===== RESET E ESTILO BASE ===== */
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#111;color:#fff;}
h1,h2,h3{margin:0;padding:0;color:#f0a500;}
header,section{padding:20px;}
button{cursor:pointer;font-weight:bold;border:none;border-radius:5px;}
button:hover{opacity:0.8;}
input[type=text], input[type=number], input[type=password]{padding:5px;margin-right:5px;border-radius:5px;border:none;}

/* ===== LAYOUT ===== */
#interface-comprador,#interface-dev{display:none;}
#produtos .produto{border:1px solid #fff;margin:10px 0;padding:15px;display:flex;justify-content:space-between;align-items:center;}
#historico,#historico-global{background:#222;padding:10px;max-height:300px;overflow:auto;}
#dashboard{margin-top:20px;border-top:2px solid #f0a500;padding-top:10px;}
#login{padding:20px;}
#alerta{position:fixed;top:10px;right:10px;background:#f0a500;color:#000;padding:10px 15px;border-radius:5px;display:none;font-weight:bold;box-shadow:0 0 10px #fff;}
.historico-item{border-bottom:1px solid #444;padding:5px 0;margin-bottom:5px;}
</style>
</head>
<body>

<header>
<h1>Loja Gangster Profissional</h1>
</header>

<!-- LOGIN PARA ACESSO DEV -->
<div id="login">
<label>Senha Dev:</label>
<input type="password" id="senhaDev" placeholder="Digite a senha"/>
<button onclick="logarDev()">Entrar</button>
</div>

<!-- BOTÃO PARA CLIENTE -->
<div id="entrarClienteContainer" style="padding:20px;">
<button id="entrarCliente" onclick="entrarCliente()">Entrar como Cliente</button>
</div>

<!-- INTERFACE COMPRADOR -->
<section id="interface-comprador">
<h2>Produtos Disponíveis</h2>
<div id="produtos"></div>
<h2>Meu Histórico</h2>
<div id="historico"></div>
</section>

<!-- INTERFACE DEV -->
<section id="interface-dev">
<h2>Dashboard do Dev</h2>
<p>Total de vendas: <span id="total-vendas">0</span></p>
<p>Total faturado: R$ <span id="total-faturado">0</span></p>
<h3>Histórico Global</h3>
<div id="historico-global"></div>
<h3>Adicionar Produto</h3>
<input type="text" id="novo-nome" placeholder="Nome do Produto"/>
<input type="number" id="novo-preco" placeholder="Preço"/>
<button onclick="adicionarProduto()">Adicionar Produto</button>
</section>

<div id="alerta"></div>

<script>
// ===== VARIÁVEIS =====
let produtos = [
  {nome:"Turbina", preco:5000},
  {nome:"Produto B", preco:200},
  {nome:"Produto C", preco:300},
  {nome:"Produto D", preco:400}
];

let vendas = [];

// ===== FUNÇÃO DE ALERTA =====
function showAlerta(msg){
  const alerta = document.getElementById("alerta");
  alerta.innerText = msg;
  alerta.style.display = "block";
  setTimeout(()=>{alerta.style.display="none";},2000);
}

// ===== FUNÇÕES DE LOGIN =====
function logarDev(){
  const senha = document.getElementById("senhaDev").value;
  if(senha==="gangster123"){ // senha dev
    document.getElementById("login").style.display="none";
    document.getElementById("entrarClienteContainer").style.display="none";
    document.getElementById("interface-dev").style.display="block";
    renderProdutos();
    atualizarDashboard();
  }else{
    alert("Senha incorreta! Acesso negado.");
    document.getElementById("senhaDev").value="";
  }
}

function entrarCliente(){
  document.getElementById("login").style.display="none";
  document.getElementById("entrarClienteContainer").style.display="none";
  document.getElementById("interface-comprador").style.display="block";
  renderProdutos();
  atualizarHistoricoComprador();
}

// ===== FUNÇÃO PARA RENDERIZAR PRODUTOS =====
function renderProdutos(){
  const div = document.getElementById("produtos");
  div.innerHTML="";
  produtos.forEach((p,i)=>{
    const prodDiv = document.createElement("div");
    prodDiv.className="produto";
    prodDiv.innerHTML=`
      <span>${p.nome} - R$ ${p.preco}</span>
      <button onclick="comprarProduto(${i})">Comprar</button>
    `;
    div.appendChild(prodDiv);
  });
}

// ===== FUNÇÃO COMPRAR =====
function comprarProduto(indice){
  const produto = produtos[indice];
  const venda = {
    produto: produto.nome,
    preco: produto.preco,
    data: new Date().toLocaleString(),
    comprador: "Cliente Anônimo"
  };
  vendas.push(venda);
  showAlerta(`Compra realizada: ${produto.nome}`);
  atualizarDashboard();
  atualizarHistoricoComprador();
  atualizarHistoricoDev();
}

// ===== FUNÇÕES DE DASHBOARD =====
function atualizarDashboard(){
  document.getElementById("total-vendas").innerText = vendas.length;
  const total = vendas.reduce((soma,v)=>soma+v.preco,0);
  document.getElementById("total-faturado").innerText = total;
  atualizarHistoricoDev();
}

// ===== FUNÇÃO HISTÓRICO COMPRADOR =====
function atualizarHistoricoComprador(){
  const historicoDiv = document.getElementById("historico");
  historicoDiv.innerHTML="";
  const historicoComprador = vendas.filter(v => v.comprador==="Cliente Anônimo");
  historicoComprador.forEach(v=>{
    const div = document.createElement("div");
    div.className="historico-item";
    div.innerHTML=`
      <strong>Produto:</strong> ${v.produto} <br>
      <strong>Preço:</strong> R$ ${v.preco} <br>
      <strong>Data:</strong> ${v.data}
    `;
    historicoDiv.appendChild(div);
  });
}

// ===== FUNÇÃO HISTÓRICO DEV =====
function atualizarHistoricoDev(){
  const div = document.getElementById("historico-global");
  div.innerHTML="";
  vendas.forEach(v=>{
    const item = document.createElement("div");
    item.className="historico-item";
    item.innerHTML=`
      <strong>Produto:</strong> ${v.produto} <br>
      <strong>Preço:</strong> R$ ${v.preco} <br>
      <strong>Data:</strong> ${v.data} <br>
      <strong>Comprador:</strong> ${v.comprador}
    `;
    div.appendChild(item);
  });
}

// ===== FUNÇÃO ADICIONAR PRODUTO =====
function adicionarProduto(){
  const nome = document.getElementById("novo-nome").value;
  const preco = Number(document.getElementById("novo-preco").value);
  if(nome && preco>0){
    produtos.push({nome,preco});
    renderProdutos();
    showAlerta(`Produto adicionado: ${nome}`);
    document.getElementById("novo-nome").value="";
    document.getElementById("novo-preco").value="";
  }else{
    alert("Preencha nome e preço válidos!");
  }
}

// ===== INICIALIZAÇÃO =====
renderProdutos();
atualizarHistoricoComprador();
atualizarHistoricoDev();
</script>

</body>
</html>
